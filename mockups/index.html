<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lavish — Mockups</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f6f4; color: #191919; font: 16px/1.5 Helvetica, Arial, sans-serif; }
    main { max-width: 1100px; margin: auto; padding: 32px 24px 56px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
    .logo { display: block; width: 110px; height: auto; }
    h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: -.03em; }
    .versions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    .card { display: block; color: inherit; text-decoration: none; border-radius: 10px; }
    .preview { display: block; width: 100%; height: auto; aspect-ratio: 1425 / 891; border: 1px solid #dededb; border-radius: 10px; background: white; }
    .label { display: block; padding: 13px 2px 0; font-size: 17px; }
    .card:hover .label { text-decoration: underline; text-underline-offset: 4px; }
    .card:hover .preview { border-color: #777; }
    .card:focus-visible { outline: 3px solid #191919; outline-offset: 6px; }
    @media (max-width: 640px) {
      main { padding: 24px 18px 40px; }
      header { margin-bottom: 24px; }
      .versions { grid-template-columns: 1fr; gap: 26px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="../assets/logo.png" alt="Lavish Event Rentals" width="245" height="121">
      <h1>Mockups</h1>
    </header>
    <nav class="versions" aria-label="Lavish mockups">
      <a class="card" href="../index.html">
        <img class="preview" src="previews/mockup-1.jpg" alt="" width="1425" height="891">
        <span class="label">Mockup 1</span>
      </a>
      <a class="card" href="v2/index.html">
        <img class="preview" src="previews/mockup-2.jpg" alt="" width="1425" height="891">
        <span class="label">Mockup 2</span>
      </a>
      <a class="card" href="v3/index.html">
        <img class="preview" src="previews/mockup-3.jpg" alt="" width="1425" height="891">
        <span class="label">Mockup 3</span>
      </a>
      <a class="card" href="v4/index.html">
        <img class="preview" src="previews/mockup-4.jpg?v=20261020-linked" alt="" width="1425" height="891">
        <span class="label">Mockup 4</span>
      </a>
    </nav>
  </main>
</body>
</html>
